name: Daily SNL Scraper

on:
  schedule:
    # Runs at 07:00 UTC (08:00 or 09:00 Norwegian time depending on DST) everyday
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to manually click a button to test run it anytime

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the bot can commit code back

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
        run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/current.json data/history.json
        # Only commit if changes actually exist to avoid empty errors
        git diff-index --quiet HEAD || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
        git push
