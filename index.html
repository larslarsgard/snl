<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNL Stats Widget</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2c2c2e;
            --accent-color: #007aff;
            --card-bg: #f5f5f7;
        }
        /* Dark mode support if your phone uses it */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1c1c1e;
                --text-color: #f2f2f7;
                --accent-color: #58a6ff;
                --card-bg: #2c2c2e;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            font-size: 13px;
        }
        .widget-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8e8e93;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .section {
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 200px;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-color);
            border-bottom: 1px solid rgba(128,128,128,0.2);
            padding-bottom: 4px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 6px;
            line-height: 1.3;
        }
        li:last-child {
            margin-bottom: 0;
        }
        .category {
            font-size: 10px;
            color: #8e8e93;
            display: block;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="widget-title" id="widget-date">SNL STATS</div>
    <div id="content">Laster data...</div>

    <script>
        // Fetch your live JSON data relative to where this HTML sits
        fetch('./data/current.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('widget-date').innerText = `SNL STATS • ${data.date}`;
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = ''; // Clear loading text

                for (const [sectionName, items] of Object.entries(data.categories)) {
                    // Create section box
                    const section = document.createElement('div');
                    section.className = 'section';

                    const title = document.createElement('h2');
                    title.className = 'section-title';
                    
                    // Parse YYYY-MM-DD to dd.mm.yy
                    let formattedDate = "";
                    if (data.date) {
                        const parts = data.date.split("-"); // [YYYY, MM, DD]
                        if (parts.length === 3) {
                            const yy = parts[0].slice(-2);  // Last two digits of year
                            const mm = parts[1];
                            const dd = parts[2];
                            formattedDate = ` (${dd}.${mm}.${yy})`;
                        }
                    }
                    
                    // Check if it's the specific header and append the date
                    if (sectionName === "Mest lest i går") {
                        title.innerText = `${sectionName}${formattedDate}`;
                    } else {
                        title.innerText = sectionName;
                    }
                    
                    section.appendChild(title);

                    const list = document.createElement('ul');
                    
                    // Show top 3 items to keep the widget compact on your phone screen
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span class="category">${item.category}</span>
                            <a href="${item.url}" target="_blank">${item.title}</a>
                        `;
                        list.appendChild(li);
                    });

                    section.appendChild(list);
                    contentDiv.appendChild(section);
                }
            })
            .catch(err => {
                document.getElementById('content').innerText = 'Feil under lasting av data.';
                console.error(err);
            });
    </script>
</body>
</html>
